
<!DOCTYPE html>
<html lang="hr">

<head>
    <meta charset="UTF-8">
    <title>Revit projekt</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            color: #222;
        }

        header {
            background-color: #5d9b5e;
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ime {
            font-size: 22px;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 30px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 60px 40px;
        }

        h1 {
            font-size: 50px;
            margin-bottom: 20px;
        }

        .uvod {
            font-size: 18px;
            line-height: 1.7;
            max-width: 750px;
            margin-bottom: 35px;
        }

        .pdf {
            width: 100%;
            height: 750px;
            border: 1px solid #ccc;
            background-color: white;
        }

        .pdf-gumb {
            display: inline-block;
            margin-top: 25px;
            padding: 14px 25px;
            background-color: #111;
            color: white;
            text-decoration: none;
        }

        .pdf-gumb:hover {
            background-color: #444;
        }

        .nazad {
            display: inline-block;
            margin-top: 35px;
            color: #222;
            text-decoration: none;
        }

        @media (max-width: 700px) {
            header {
                flex-direction: column;
                gap: 20px;
            }

            nav a {
                margin-left: 8px;
                margin-right: 8px;
            }

            main {
                padding: 40px 20px;
            }

            h1 {
                font-size: 38px;
            }

            .pdf {
                height: 550px;
            }
        }
        .revit-slika {
    width: 100%;
    max-width: 900px;
    height: auto;
    display: block;
    margin: 30px auto;
    border: 1px solid #ccc;
}
    </style>
</head>

<body>

        </nav>
    </header>

    <main>

            Ovo je moj prvi projekt izrađen u programu Autodesk Revit.

<img

</html>
